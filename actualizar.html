<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Actualizar Nuestra Vida</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff7f9;font-family:system-ui,sans-serif;color:#3f3035}
    main{width:min(86vw,360px);padding:24px;border:1px solid #efd5dd;border-radius:18px;background:#fff;text-align:center;box-shadow:0 12px 32px #6f29401a}
    h1{font-size:21px;margin:0 0 10px}p{font-size:14px;line-height:1.45}.ok{color:#287a48}.error{color:#a12f50}
  </style>
</head>
<body><main><h1>Actualizando Nuestra Vida</h1><p id="status">Eliminando la caché anterior…</p></main>
<script>
(async()=>{
 const status=document.querySelector('#status');
 try{
   if('serviceWorker' in navigator){
     const registrations=await navigator.serviceWorker.getRegistrations();
     await Promise.all(registrations.map(registration=>registration.unregister()));
   }
   if('caches' in window){
     const keys=await caches.keys();
     await Promise.all(keys.map(key=>caches.delete(key)));
   }
   status.className='ok';
   status.textContent='Caché eliminada. Abriendo la versión nueva…';
   const target=new URL('./index.html',location.href);
   target.searchParams.set('actualizar',Date.now());
   setTimeout(()=>location.replace(target.href),500);
 }catch(error){
   status.className='error';
   status.textContent='No se ha podido limpiar automáticamente. Borra los datos del sitio desde el navegador.';
 }
})();
</script></body></html>
