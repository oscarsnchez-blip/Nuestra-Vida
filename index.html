<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2b8c6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css?v=018">
  <link rel="stylesheet" href="compra-4-columnas-v017.css?v=022">
  <style id="nv-nav-structure">
    nav{display:grid!important;grid-template-columns:repeat(7,minmax(0,1fr))!important;gap:0!important}
    nav button{min-width:0!important;padding-left:2px!important;padding-right:2px!important}
    nav button i{font-size:20px!important}
    nav button span{font-size:10px!important;white-space:nowrap}
    .girls-page{padding:0 0 92px!important}
    .girls-page>.nv-page-heading{margin:0 0 12px!important;padding:2px 0 8px!important}
    @media(max-width:370px){nav button i{font-size:18px!important}nav button span{font-size:9px!important}}
  </style>
  <title>Nuestra Vida</title>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js?v=020"></script>
  <script src="menu-v020.js?v=024"></script>
  <script src="ninas.js?v=005"></script>
  <script src="menu-cena-siena-v001.js?v=003"></script>
  <script id="nv-navigation-fix">
    (() => {
      let sx=0,sy=0,cx=0,cy=0,tracking=false,previousView='';
      const blocked=t=>t.closest('input,textarea,select,.modal,.drag-handle,.history-grid.custom-sort,.meal-choice-backdrop,.girls-overlay');
      const view=()=>document.querySelector('#view');
      document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-menu-tab],[data-girls-tab]'))previousView=view()?.innerHTML||''},true);
      new MutationObserver(()=>{const current=view();if(!current||!previousView)return;if(current.querySelector('.menu-loading')||/Cargando…|Cargando menú familiar/.test(current.textContent||'')){current.innerHTML=previousView}else if(current.querySelector('.menu-page,.girls-page'))previousView=''}).observe(document.documentElement,{childList:true,subtree:true});
      document.addEventListener('click',e=>{if(!e.target.closest('[data-child],[data-school-day]'))return;const y=window.scrollY;requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,y)));setTimeout(()=>window.scrollTo(0,y),80)},true);
      document.addEventListener('touchstart',e=>{if(e.touches.length!==1||blocked(e.target))return;const t=e.touches[0];sx=cx=t.clientX;sy=cy=t.clientY;tracking=true},{capture:true,passive:true});
      document.addEventListener('touchmove',e=>{if(!tracking||e.touches.length!==1)return;const t=e.touches[0];cx=t.clientX;cy=t.clientY},{capture:true,passive:true});
      document.addEventListener('touchend',e=>{if(!tracking)return;tracking=false;const t=e.changedTouches[0],dx=(t?.clientX??cx)-sx,dy=(t?.clientY??cy)-sy;if(Math.abs(dx)<45||Math.abs(dx)<Math.abs(dy)*1.15)return;const buttons=[...document.querySelectorAll('nav button')].filter(b=>b.offsetParent!==null),current=buttons.findIndex(b=>b.classList.contains('active')),next=dx<0?current+1:current-1;if(current<0||next<0||next>=buttons.length)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();buttons[next].click();window.scrollTo(0,0)},{capture:true,passive:false});
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=022', {updateViaCache:'none'}).then(r => r.update());
    }
  </script>
</body>
</html>
