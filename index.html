<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2b8c6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css?v=018">
  <link rel="stylesheet" href="compra-4-columnas-v017.css?v=022">
  <style id="nv-nav-structure">
    nav{display:grid!important;grid-template-columns:repeat(7,minmax(0,1fr))!important;gap:0!important}
    nav button{min-width:0!important;padding-left:2px!important;padding-right:2px!important}
    nav button i{font-size:20px!important}
    nav button span{font-size:10px!important;white-space:nowrap}
    .girls-page{padding-top:12px!important}
    .girls-page>.nv-page-heading{margin-top:0!important;margin-bottom:12px!important;padding-top:2px!important}
    @media(max-width:370px){nav button i{font-size:18px!important}nav button span{font-size:9px!important}}
  </style>
  <title>Nuestra Vida</title>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js?v=020"></script>
  <script src="menu-v020.js?v=024"></script>
  <script src="ninas.js?v=004"></script>
  <script src="menu-cena-siena-v001.js?v=003"></script>
  <script id="nv-navigation-fix">
    (() => {
      let sx=0, sy=0, cx=0, cy=0, tracking=false;
      const blocked = target => target.closest('input,textarea,select,.modal,.drag-handle,.history-grid.custom-sort,.meal-choice-backdrop,.girls-overlay');
      document.addEventListener('touchstart', event => {
        if (event.touches.length !== 1 || blocked(event.target)) return;
        const touch=event.touches[0];
        sx=cx=touch.clientX; sy=cy=touch.clientY; tracking=true;
      }, {capture:true,passive:true});
      document.addEventListener('touchmove', event => {
        if (!tracking || event.touches.length !== 1) return;
        const touch=event.touches[0]; cx=touch.clientX; cy=touch.clientY;
      }, {capture:true,passive:true});
      document.addEventListener('touchend', event => {
        if (!tracking) return;
        tracking=false;
        const touch=event.changedTouches[0];
        const dx=(touch?.clientX ?? cx)-sx, dy=(touch?.clientY ?? cy)-sy;
        if (Math.abs(dx)<45 || Math.abs(dx)<Math.abs(dy)*1.15) return;
        const buttons=[...document.querySelectorAll('nav button')].filter(button=>button.offsetParent!==null);
        const current=buttons.findIndex(button=>button.classList.contains('active'));
        if (current<0) return;
        const next=dx<0?current+1:current-1;
        if (next<0 || next>=buttons.length) return;
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
        buttons[next].click();
        window.scrollTo(0,0);
      }, {capture:true,passive:false});
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=021', {updateViaCache:'none'}).then(r => r.update());
    }
  </script>
</body>
</html>
